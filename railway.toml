[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Keep the runtime command in code so Railway dashboard-level overrides cannot
# accidentally deploy a container whose main process exits. The dashboard itself
# is owned by the Dockerfile's s6 service and listens on Railway target port 9119.
startCommand = "/init /opt/hermes/docker/main-wrapper.sh sleep infinity"
healthcheckPath = "/api/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
