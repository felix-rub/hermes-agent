[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Railway production auto-deploy is intentionally gated. This fork tracks a
# fast-moving public upstream, so normal upstream-sync pushes must not deploy
# production. To promote a reviewed commit, update railway-deploy.trigger in
# the same commit (or deploy explicitly with `railway up`).
watchPatterns = ["railway-deploy.trigger"]

[deploy]
# Keep the runtime command in code so Railway dashboard-level overrides cannot
# accidentally deploy a container with no listener on Railway's injected PORT.
# The Dockerfile's s6 dashboard also serves the existing public target port 9119.
startCommand = "/init /opt/hermes/docker/main-wrapper.sh sh -c \"exec hermes dashboard --host 0.0.0.0 --port ${PORT:-9119} --no-open --insecure\""
healthcheckPath = "/api/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
